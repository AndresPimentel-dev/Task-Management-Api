version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: taskforge_postgres_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=taskforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: taskforge_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:secretpassword@db:5432/taskforge_db
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
